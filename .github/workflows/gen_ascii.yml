name: Generate Ascii

on:
    push:
        branches: [main]

jobs:
    generate-ascii:
        runs-on: ubuntu-latest
        steps:
            - name: Generating ASCII Cow art
              run: |
                    sudo apt-get install -y cowsay
                    cowsay -f tux "Hello there Omnath! Welcome to GitHub Actions!" > ascii_art.txt
                    chmod +x ascii_art.txt
                    cat ascii_art.txt
            